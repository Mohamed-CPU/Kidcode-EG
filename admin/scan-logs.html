<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>سجل المسحات — لوحة الأدمن</title>

  <script>
    (function() {
      try {
        var theme = localStorage.getItem('admin_theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/all.min.css">

  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="stylesheet" href="/admin/css/theme-light.css">
  <link rel="stylesheet" href="/admin/css/theme-dark.css">
  <link rel="stylesheet" href="/admin/css/components.css">
  <link rel="stylesheet" href="/admin/css/scan-logs.css">
</head>
<body>

  <div class="admin-layout">
    <div id="navbarPlaceholder"></div>

    <main class="admin-main">
      <header class="admin-topbar">
        <button class="topbar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h1 class="topbar-title">سجل المسحات</h1>
        <div class="topbar-actions">
          <button class="topbar-btn" id="reloadListBtn" title="تحديث">
            <i class="fas fa-sync-alt"></i>
          </button>
          <button class="topbar-btn" id="themeToggleBtn" title="تبديل الثيم">
            <i class="fas fa-moon"></i>
          </button>
        </div>
      </header>

      <div class="admin-content">

        <div class="page-header">
          <h1><i class="fas fa-qrcode"></i> سجل المسحات</h1>
          <p>عرض كل عمليات فتح روابط QR مع الموقع والجهاز</p>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon primary"><i class="fas fa-database"></i></div>
            <div class="stat-info">
              <span class="stat-label">إجمالي المسحات</span>
              <div class="stat-value" id="statTotal">—</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon success"><i class="fas fa-clock"></i></div>
            <div class="stat-info">
              <span class="stat-label">آخر 24 ساعة</span>
              <div class="stat-value" id="stat24h">—</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon warning"><i class="fas fa-calendar-week"></i></div>
            <div class="stat-info">
              <span class="stat-label">آخر 7 أيام</span>
              <div class="stat-value" id="stat7d">—</div>
            </div>
          </div>
        </div>

        <div class="filters-bar">
          <input type="text" id="searchInput" class="form-control search" placeholder="🔍 بحث بالكود، العنوان، IP...">
          <div class="date-group">
            <input type="date" id="fromDate" class="form-control" placeholder="من">
            <input type="date" id="toDate" class="form-control" placeholder="إلى">
          </div>
          <select id="sourceFilter" class="form-select">
            <option value="">كل المصادر</option>
            <option value="page_open">فتح الصفحة</option>
            <option value="auto_on_page_load">تلقائي عند الفتح</option>
            <option value="periodic_tick">تتبع دوري</option>
            <option value="gps_manual">GPS مباشر</option>
            <option value="manual_refused">رفض من المستخدم</option>
            <option value="manual_failed">فشل من المستخدم</option>
            <option value="auto_refused">رفض تلقائي</option>
            <option value="auto_failed">فشل تلقائي</option>
            <option value="auto_browser_not_support">متصفح غير مدعوم</option>
          </select>
          <button class="btn btn-secondary" id="clearFiltersBtn">
            <i class="fas fa-times"></i> مسح
          </button>
        </div>

        <div class="toolbar">
          <span class="toolbar-info" id="listInfo">جاري التحميل...</span>
          <button class="btn btn-warning btn-sm" id="cleanupBtn">
            <i class="fas fa-broom"></i> تنظيف السجلات القديمة
          </button>
        </div>

        <div class="scan-table-wrapper">
          <table class="scan-table">
            <thead>
              <tr>
                <th class="cell-num">#</th>
                <th>التاريخ والوقت</th>
                <th>الكود</th>
                <th class="col-name">الطفل</th>
                <th class="col-source">المصدر</th>
                <th class="col-address">العنوان</th>
                <th class="col-ip">IP</th>
                <th>الموقع</th>
                <th class="cell-actions">حذف</th>
              </tr>
            </thead>
            <tbody id="scanLogsTableBody">
              <tr><td colspan="9" style="text-align:center; padding:40px;">
                <i class="fas fa-spinner fa-spin" style="font-size:1.5rem; color:var(--accent);"></i>
              </td></tr>
            </tbody>
          </table>
        </div>

        <div class="pagination-bar" id="paginationBar"></div>

      </div>
    </main>
  </div>

  <script src="/admin/js/utils.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/error-reporter.js" defer></script>
  <script src="/admin/js/ui.js"></script>
  <script src="/admin/js/core.js"></script>
  <script src="/admin/js/freeze.js"></script>
  <script src="/admin/js/navbar.js"></script>
  <script src="/admin/js/scan-logs.js"></script>

  <script>
    window.onSessionFrozen = function(info) {
      if (window.FreezeOverlay) window.FreezeOverlay.show(info);
    };
    window.onFreezeUpdate = function(info) {
      if (window.FreezeOverlay) window.FreezeOverlay.update(info);
    };
    window.onSessionUnfrozen = function() {
      if (window.FreezeOverlay) window.FreezeOverlay.hide();
      if (window.UI) window.UI.toast.success('تم رفع التجميد.');
    };
    window.onAccountDisabled = function() {
      if (window.FreezeOverlay) window.FreezeOverlay.hide();
      if (window.UI) {
        window.UI.toast.error('الحساب معطَّل. تواصل مع superAdmin.', { duration: 0, title: 'معطَّل' });
      }
    };

    (async function() {
      const ok = await window.Core.guard();
      if (!ok) return;

      await window.Navbar.load('navbarPlaceholder');

      const themeBtn = document.getElementById('themeToggleBtn');
      if (themeBtn) {
        themeBtn.addEventListener('click', async function() {
          await window.Core.toggleTheme();
        });
      }

      const reloadBtn = document.getElementById('reloadListBtn');
      if (reloadBtn) {
        reloadBtn.addEventListener('click', function() {
          if (window.ScanLogsPage) window.ScanLogsPage.reload();
        });
      }

      if (window.ScanLogsPage) window.ScanLogsPage.init();
    })();
  </script>

</body>
</html>
