<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>تغيير كلمة السر مطلوب — لوحة الأدمن</title>

  <script>
    (function() {
      try {
        var theme = localStorage.getItem('admin_theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/all.min.css">

  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="stylesheet" href="/admin/css/theme-light.css">
  <link rel="stylesheet" href="/admin/css/theme-dark.css">
  <link rel="stylesheet" href="/admin/css/components.css">

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }
    .change-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 44px 36px 32px;
      max-width: 520px;
      width: 100%;
      border-top: 4px solid var(--warning);
      animation: cardEnter 0.4s ease;
    }
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .change-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FEF3C7, #FDE68A);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #D97706;
      font-size: 1.8rem;
    }
    .change-title {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .change-sub {
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 26px;
      line-height: 1.7;
    }
    .change-form .form-group {
      margin-bottom: 16px;
    }
    .change-btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      min-height: 52px;
      margin-top: 6px;
    }
    .change-error {
      background: rgba(239, 68, 68, 0.1);
      border-right: 4px solid var(--danger);
      color: var(--danger);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 700;
      margin-top: 16px;
      display: none;
      text-align: center;
    }
    .change-error.show { display: block; }

    /* ✅ حقل كلمة السر مع زر العين */
    .password-field {
      position: relative;
      display: flex;
      align-items: center;
    }
    .password-field .form-control {
      padding-left: 46px;
      width: 100%;
    }
    .password-toggle {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.92rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      border: none;
    }
    .password-toggle:hover {
      background: var(--bg-hover);
      color: var(--accent);
    }
    .password-toggle:active {
      transform: translateY(-50%) scale(0.95);
    }

    .pwd-rules {
      background: var(--bg-hover);
      border-right: 3px solid var(--info);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .pwd-rules-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .pwd-rules ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .pwd-rules li {
      font-size: 0.78rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s;
    }
    .pwd-rules li i {
      font-size: 0.55rem;
      color: var(--text-muted);
    }
    .pwd-rules li.valid {
      color: var(--success-dark);
      font-weight: 700;
    }
    .pwd-rules li.valid i {
      color: var(--success);
    }
    @media (max-width: 480px) {
      .pwd-rules ul { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="change-card">

    <div class="change-icon">
      <i class="fas fa-key"></i>
    </div>

    <h1 class="change-title">تغيير كلمة السر مطلوب</h1>
    <p class="change-sub">
      هذه أول مرة تسجّل فيها الدخول. يجب تعيين كلمة مرور جديدة خاصة بك قبل المتابعة.
    </p>

    <form class="change-form" id="changeForm">

      <div class="form-group">
        <label class="form-label required" for="newPassword">كلمة السر الجديدة</label>
        <div class="password-field">
          <input type="password" id="newPassword" class="form-control" dir="ltr"
                 placeholder="أدخل كلمة مرور قوية" autocomplete="new-password">
          <button type="button" class="password-toggle" data-target="newPassword" aria-label="إظهار/إخفاء">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label required" for="confirmPassword">تأكيد كلمة السر</label>
        <div class="password-field">
          <input type="password" id="confirmPassword" class="form-control" dir="ltr"
                 placeholder="أعد إدخال كلمة السر" autocomplete="new-password">
          <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="إظهار/إخفاء">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="pwd-rules">
        <div class="pwd-rules-title">
          <i class="fas fa-shield-halved"></i> الشروط:
        </div>
        <ul id="rulesList">
          <li data-rule="length"><i class="fas fa-circle"></i> 10 أحرف على الأقل</li>
          <li data-rule="upper"><i class="fas fa-circle"></i> حرف كبير (A-Z)</li>
          <li data-rule="lower"><i class="fas fa-circle"></i> حرف صغير (a-z)</li>
          <li data-rule="number"><i class="fas fa-circle"></i> رقم (0-9)</li>
          <li data-rule="symbol"><i class="fas fa-circle"></i> رمز خاص (@ # $ ...)</li>
          <li data-rule="noArabic"><i class="fas fa-circle"></i> بدون حروف عربية</li>
        </ul>
      </div>

      <button type="submit" class="btn btn-warning change-btn" id="submitBtn">
        <i class="fas fa-check"></i>
        <span>تعيين كلمة السر والمتابعة</span>
      </button>

      <div class="change-error" id="errorBox"></div>

    </form>

  </div>

  <script src="/js/config.js"></script>
  <script src="/js/error-reporter.js" defer></script>
  <script src="/admin/js/ui.js"></script>
  <script src="/admin/js/core.js"></script>

  <script>
    (function() {
      'use strict';

      const form = document.getElementById('changeForm');
      const newPwdInput = document.getElementById('newPassword');
      const confirmPwdInput = document.getElementById('confirmPassword');
      const submitBtn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');
      const rulesList = document.getElementById('rulesList');

      // ============================================================
      //  🛡️ فحص الجلسة أولاً
      // ============================================================
      (async function init() {
        // ✅ حمّل الجلسة صراحةً أولًا
        window.Core.loadSession();

        const token = window.Core.getState().sessionToken;
        if (!token) {
          window.location.href = '/admin/';
          return;
        }

        const verify = await window.Core.verifySession();
        if (!verify.valid) {
          window.Core.clearSession();
          window.location.href = '/admin/';
          return;
        }

        // ✅ إذا لم تعد بحاجة لتغيير كلمة السر، اذهب للوحة
        if (verify.user && !verify.user.mustChangePassword) {
          window.location.href = '/admin/dashboard.html';
          return;
        }

        setTimeout(function() { newPwdInput.focus(); }, 200);
      })();

      // ============================================================
      //  👁️ إظهار/إخفاء كلمة السر
      // ============================================================
      document.querySelectorAll('.password-toggle').forEach(function(btn) {
        btn.addEventListener('click', function() {
          const targetId = this.getAttribute('data-target');
          const input = document.getElementById(targetId);
          if (!input) return;

          const currentType = input.getAttribute('type');
          const nextType = currentType === 'password' ? 'text' : 'password';
          input.setAttribute('type', nextType);

          const icon = this.querySelector('i');
          if (icon) {
            icon.className = nextType === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
          }

          input.focus();
        });
      });

      // ============================================================
      //  📋 فحص حي للشروط
      // ============================================================
      function validateRules(pwd) {
        return {
          length: pwd.length >= 10,
          upper: /[A-Z]/.test(pwd),
          lower: /[a-z]/.test(pwd),
          number: /[0-9]/.test(pwd),
          symbol: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?~`]/.test(pwd),
          noArabic: !/[\u0600-\u06FF]/.test(pwd)
        };
      }

      function updateRulesUI(pwd) {
        const rules = validateRules(pwd);
        const hasInput = pwd.length > 0;

        rulesList.querySelectorAll('li').forEach(function(li) {
          const ruleName = li.getAttribute('data-rule');
          const isValid = rules[ruleName];
          const icon = li.querySelector('i');

          li.classList.remove('valid');
          if (hasInput && isValid) {
            li.classList.add('valid');
            icon.className = 'fas fa-check';
          } else if (hasInput) {
            icon.className = 'fas fa-times';
          } else {
            icon.className = 'fas fa-circle';
          }
        });
      }

      function isPasswordValid(pwd) {
        const rules = validateRules(pwd);
        return rules.length && rules.upper && rules.lower
            && rules.number && rules.symbol && rules.noArabic;
      }

      // ============================================================
      //  🎯 ربط الأحداث
      // ============================================================
      newPwdInput.addEventListener('input', function() {
        updateRulesUI(this.value);
        hideError();
      });

      confirmPwdInput.addEventListener('input', hideError);

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.add('show');
      }

      function hideError() {
        errorBox.classList.remove('show');
        errorBox.textContent = '';
      }

      // ============================================================
      //  🚀 الإرسال
      // ============================================================
      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        hideError();

        const newPwd = newPwdInput.value;
        const confirmPwd = confirmPwdInput.value;

        if (!isPasswordValid(newPwd)) {
          showError('❌ كلمة السر لا تستوفي الشروط');
          return;
        }

        if (newPwd !== confirmPwd) {
          showError('❌ كلمة السر وتأكيدها غير متطابقين');
          return;
        }

        window.UI.setLoading(submitBtn, true, 'جاري الحفظ...');

        try {
          const result = await window.Core.api('completeFirstLoginPasswordChange', {
            newPassword: newPwd
          }, 'POST');

          if (result.success) {
            window.UI.toast.success('✅ تم تعيين كلمة السر بنجاح');
            setTimeout(function() {
              window.location.href = '/admin/dashboard.html';
            }, 800);
          } else {
            showError('❌ ' + (result.message || 'فشل التغيير'));
            window.UI.setLoading(submitBtn, false);
          }
        } catch (err) {
          showError('❌ ' + (err.userMessage || 'تعذر الاتصال'));
          window.UI.setLoading(submitBtn, false);
        }
      });

    })();
  </script>

</body>
</html>
