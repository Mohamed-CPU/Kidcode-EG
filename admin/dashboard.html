<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>لوحة المعلومات — لوحة الأدمن</title>

  <script>
    (function() {
      try {
        var theme = localStorage.getItem('admin_theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/all.min.css">

  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="stylesheet" href="/admin/css/theme-light.css">
  <link rel="stylesheet" href="/admin/css/theme-dark.css">
  <link rel="stylesheet" href="/admin/css/components.css">

  <style>
    .page-header { margin-bottom: 24px; }
    .page-header h1 {
      font-size: 1.5rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .page-header h1 i { color: var(--accent); }
    .page-header p { font-size: 0.88rem; color: var(--text-muted); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .dashboard-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (min-width: 1100px) {
      .dashboard-row.split {
        grid-template-columns: 3fr 2fr;
      }
    }

    .chart-container {
      position: relative;
      height: 280px;
      width: 100%;
    }

    .status-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .status-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-hover);
      border-radius: var(--radius-md);
      gap: 12px;
    }
    .status-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.active    { background: var(--success); }
    .status-dot.pending   { background: var(--warning); }
    .status-dot.disabled  { background: var(--text-muted); }
    .status-dot.suspended { background: #8B5CF6; }
    .status-dot.expired   { background: #EC4899; }
    .status-dot.deleted   { background: var(--danger); }
    .status-dot.other     { background: var(--border-strong); }

    .status-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-secondary);
    }
    .status-value {
      font-size: 1rem;
      font-weight: 900;
      color: var(--text-primary);
      font-family: var(--font-mono);
    }

    .activity-item {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-hover);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: var(--accent);
      flex-shrink: 0;
    }
    .activity-info { flex: 1; min-width: 0; }
    .activity-action {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 2px;
    }
    .activity-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>

  <div class="admin-layout">
    <div id="navbarPlaceholder"></div>

    <main class="admin-main">
      <header class="admin-topbar">
        <button class="topbar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h1 class="topbar-title">لوحة المعلومات</h1>
        <div class="topbar-actions">
          <button class="topbar-btn" id="reloadStatsBtn" title="تحديث">
            <i class="fas fa-sync-alt"></i>
          </button>
          <button class="topbar-btn" id="themeToggleBtn" title="تبديل الثيم">
            <i class="fas fa-moon"></i>
          </button>
        </div>
      </header>

      <div class="admin-content">

        <div class="page-header">
          <h1><i class="fas fa-chart-pie"></i> لوحة المعلومات</h1>
          <p>نظرة عامة على نشاط المنصة</p>
        </div>

        <!-- البطاقات الإحصائية -->
        <div class="stats-grid" id="statsGrid">
          <div class="stat-card">
            <div class="stat-icon primary"><i class="fas fa-child"></i></div>
            <div class="stat-info">
              <span class="stat-label">إجمالي الأطفال</span>
              <div class="stat-value" id="statChildren">—</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon success"><i class="fas fa-user-tie"></i></div>
            <div class="stat-info">
              <span class="stat-label">المسوقون النشطون</span>
              <div class="stat-value" id="statMarketers">—</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon info"><i class="fas fa-bell"></i></div>
            <div class="stat-info">
              <span class="stat-label">المشتركون</span>
              <div class="stat-value" id="statNewsletter">—</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon danger"><i class="fas fa-exclamation-triangle"></i></div>
            <div class="stat-info">
              <span class="stat-label">بلاغات مفتوحة</span>
              <div class="stat-value" id="statReports">—</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon warning"><i class="fas fa-user-shield"></i></div>
            <div class="stat-info">
              <span class="stat-label">المسؤولون النشطون</span>
              <div class="stat-value" id="statAdmins">—</div>
            </div>
          </div>
        </div>

        <!-- الصف الأول: الرسم البياني + توزيع الحالات -->
        <div class="dashboard-row split">
          <div class="card">
            <div class="card-header">
              <h2 class="card-title"><i class="fas fa-chart-line"></i> التسجيلات — آخر 30 يومًا</h2>
            </div>
            <div class="card-body">
              <div class="chart-container">
                <canvas id="registrationsChart"></canvas>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h2 class="card-title"><i class="fas fa-chart-pie"></i> توزيع الحالات</h2>
            </div>
            <div class="card-body">
              <div class="status-list" id="statusList">
                <div class="loading-state"><i class="fas fa-spinner fa-spin"></i></div>
              </div>
            </div>
          </div>
        </div>

        <!-- الصف الثاني: أحدث التسجيلات + النشاط -->
        <div class="dashboard-row split">
          <div class="card">
            <div class="card-header">
              <h2 class="card-title"><i class="fas fa-user-plus"></i> أحدث التسجيلات</h2>
            </div>
            <div class="card-body" style="padding: 0;">
              <div class="table-wrapper" style="border: none; border-radius: 0;">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>الكود</th>
                      <th>الاسم</th>
                      <th>الحالة</th>
                      <th>الخطة</th>
                      <th>التاريخ</th>
                    </tr>
                  </thead>
                  <tbody id="recentRegistrationsBody">
                    <tr><td colspan="5" style="text-align:center; padding:30px;"><i class="fas fa-spinner fa-spin"></i></td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h2 class="card-title"><i class="fas fa-stream"></i> آخر العمليات</h2>
            </div>
            <div class="card-body" id="recentActivityList">
              <div class="loading-state"><i class="fas fa-spinner fa-spin"></i></div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="/admin/js/utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/error-reporter.js" defer></script>
  <script src="/admin/js/ui.js"></script>
  <script src="/admin/js/core.js"></script>
  <script src="/admin/js/freeze.js"></script>
  <script src="/admin/js/navbar.js"></script>
  <script src="/admin/js/dashboard.js"></script>

  <script>
    window.onSessionFrozen = function(info) {
      if (window.FreezeOverlay) window.FreezeOverlay.show(info);
    };
    window.onFreezeUpdate = function(info) {
      if (window.FreezeOverlay) window.FreezeOverlay.update(info);
    };
    window.onSessionUnfrozen = function() {
      if (window.FreezeOverlay) window.FreezeOverlay.hide();
      if (window.UI) window.UI.toast.success('تم رفع التجميد.');
    };
    window.onAccountDisabled = function() {
      if (window.FreezeOverlay) window.FreezeOverlay.hide();
      if (window.UI) {
        window.UI.toast.error('الحساب معطَّل. تواصل مع superAdmin.', { duration: 0, title: 'معطَّل' });
      }
    };

    (async function() {
      const ok = await window.Core.guard();
      if (!ok) return;

      await window.Navbar.load('navbarPlaceholder');

      const themeBtn = document.getElementById('themeToggleBtn');
      if (themeBtn) {
        themeBtn.addEventListener('click', async function() {
          await window.Core.toggleTheme();
        });
      }

      const reloadBtn = document.getElementById('reloadStatsBtn');
      if (reloadBtn) {
        reloadBtn.addEventListener('click', function() {
          if (window.DashboardPage) window.DashboardPage.reload();
        });
      }

      if (window.DashboardPage) window.DashboardPage.init();
    })();
  </script>

</body>
</html>
