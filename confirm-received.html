<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=GT-TB7R77BQ"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'GT-TB7R77BQ');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>تأكيد استلام الطفل - كيدكود-ايجي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/all.min.css">
    <link rel="stylesheet" href="css/base/main.css">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/logo2.png">
    <style>
        .confirm-wrapper {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .confirm-card {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(34, 85, 159, 0.06);
        }
        .confirm-card .icon-big {
            font-size: 4rem;
            color: var(--secondary-color);
            text-align: center;
            display: block;
            margin-bottom: 8px;
        }
        .confirm-card .icon-big.warning {
            color: var(--warning-color);
        }
        .confirm-card h1 {
            text-align: center;
            font-weight: 900;
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 6px;
        }
        .confirm-card .sub-desc {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 24px;
            line-height: 1.8;
        }
        .confirm-card .info-box {
            background: var(--bg-body);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            margin-bottom: 20px;
            border-right: 4px solid var(--primary-color);
        }
        .confirm-card .info-box p {
            margin: 6px 0;
            font-size: 0.95rem;
        }
        .confirm-card .info-box .label {
            font-weight: 700;
            color: var(--text-secondary);
        }
        .confirm-card .info-box .value {
            font-weight: 700;
            color: var(--text-primary);
        }
        .confirm-card .info-box .divider {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 10px 0;
        }
        .confirm-card .form-group {
            margin-bottom: 18px;
        }
        .confirm-card .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .confirm-card .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-family: var(--font-arabic);
            background: var(--bg-white);
            color: var(--text-primary);
            transition: all 0.3s ease;
            resize: vertical;
            min-height: 80px;
        }
        .confirm-card .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(34, 85, 159, 0.08);
        }
        .confirm-card .form-group .hint {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 4px;
        }
        .confirm-card .btn-submit {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 800;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, var(--secondary-color) 0%, #2b8557 100%);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(57, 166, 111, 0.2);
            margin-top: 10px;
        }
        .confirm-card .btn-submit:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(57, 166, 111, 0.3);
        }
        .confirm-card .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .confirm-card .btn-danger-custom {
            background: linear-gradient(135deg, var(--danger-color) 0%, #c62836 100%);
        }
        .confirm-card .btn-danger-custom:hover:not(:disabled) {
            box-shadow: 0 8px 25px rgba(230, 57, 70, 0.3);
        }
        .confirm-card .message-box {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            text-align: center;
            font-weight: 700;
            display: none;
        }
        .confirm-card .message-box.success {
            display: block;
            background: #e8f5ee;
            color: var(--secondary-dark);
            border-right: 4px solid var(--secondary-color);
        }
        .confirm-card .message-box.error {
            display: block;
            background: #fee2e2;
            color: #991B1B;
            border-right: 4px solid var(--danger-color);
        }
        .confirm-card .message-box.warning {
            display: block;
            background: #fef3c7;
            color: #92400e;
            border-right: 4px solid #f59e0b;
        }
        .confirm-card .btn-alternative {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: var(--primary-color);
            font-weight: 700;
            text-decoration: underline;
        }
        .confirm-card .expired-warning {
            background: #fee2e2;
            border-right: 4px solid var(--danger-color);
            padding: 16px 20px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            color: #991B1B;
            font-weight: 700;
            text-align: center;
        }
        @media (max-width: 480px) {
            .confirm-card {
                padding: 24px 16px;
                border-radius: var(--radius-md);
            }
        }
    </style>
</head>
<body>

<!-- ===== الهيدر الموحد (يتم تضمينه عبر JS) ===== -->
<div id="headerPlaceholder"></div>

<!-- ===== المحتوى ===== -->
<main>
    <div class="confirm-wrapper">
        <div class="confirm-card">
            <span class="icon-big"><i class="fas fa-check-circle"></i></span>
            <h1>تأكيد استلام الطفل</h1>
            <p class="sub-desc">
                عزيزي ولي الأمر، يرجى تأكيد استلام طفلك لإغلاق البلاغ نهائياً.
            </p>

            <div id="reportInfo" class="info-box">
                <p><span class="label">رقم البلاغ:</span> <span class="value" id="reportIdDisplay">---</span></p>
                <p><span class="label">اسم الطفل:</span> <span class="value" id="childNameDisplay">---</span></p>
                <p><span class="label">معرف الطفل:</span> <span class="value" id="childIdDisplay">---</span></p>
                <hr class="divider">
                <p><span class="label">اسم المتطوع:</span> <span class="value" id="volunteerNameDisplay">---</span></p>
                <p><span class="label">رقم هاتف المتطوع:</span> <span class="value" id="volunteerPhoneDisplay">---</span></p>
            </div>

            <div id="expiredWarning" class="expired-warning" style="display:none;">
                هذا البلاغ تم حله بالفعل أو انتهت صلاحيته.
            </div>

            <form id="confirmReceivedForm" novalidate>
                <div class="form-group">
                    <label for="parentFeedback">تقييمك لتجربة المتطوع أو الخدمة (اختياري)</label>
                    <textarea id="parentFeedback" placeholder="اكتب تقييمك هنا..."></textarea>
                    <div class="hint">يمكنك كتابة أي ملاحظات حول تجربتك مع المتطوع أو الخدمة بشكل عام.</div>
                </div>

                <button type="submit" class="btn-submit" id="confirmReceivedBtn">
                    <i class="fas fa-check"></i> تأكيد استلام الطفل وإغلاق البلاغ
                </button>
            </form>

            <div id="confirmMessage" class="message-box"></div>

            <a href="/" class="btn-alternative">
                <i class="fas fa-arrow-right"></i> العودة للرئيسية
            </a>
        </div>
    </div>
</main>

<!-- ===== الفوتر الموحد (يتم تحميله عبر JS) ===== -->
<div id="footerPlaceholder"></div>

<!-- ===== السكربتات (الترتيب الصحيح) ===== -->
<script src="js/config.js"></script>
<script src="js/header.js"></script>
<script>
    // تحميل الهيدر من ملف خارجي
    fetch('/header.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('headerPlaceholder').innerHTML = data;
        })
        .catch(err => console.warn('⚠️ فشل تحميل الهيدر:', err));
</script>
<script src="js/pages/confirm-received.js"></script>

<!-- ===== تحميل الفوتر الموحد ===== -->
<script>
    (function() {
        const footerPlaceholder = document.getElementById('footerPlaceholder');
        if (!footerPlaceholder) return;

        fetch('/footer.html')
            .then(response => {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.text();
            })
            .then(html => {
                footerPlaceholder.innerHTML = html;
            })
            .catch(err => {
                console.warn('⚠️ فشل تحميل الفوتر:', err);
                footerPlaceholder.innerHTML = `
                    <footer class="site-footer">
                        <p style="text-align:center; padding:20px; color:#94A3B8;">
                            KidCode-EG © 2026. جميع الحقوق محفوظة.
                        </p>
                    </footer>
                `;
            });
    })();
</script>

</body>
</html>
