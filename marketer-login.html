<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=GT-TB7R77BQ"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'GT-TB7R77BQ');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>تسجيل دخول المسوقين - كيدكود-ايجي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/all.min.css">
    <link rel="stylesheet" href="css/base/main.css">
    <link rel="stylesheet" href="css/pages/marketer-login.css">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/logo2.png">
</head>
<body>

<!-- ===== الهيدر الموحد (يتم تضمينه عبر JS) ===== -->
<div id="headerPlaceholder"></div>

<main>
    <div class="login-wrapper">
        <div class="login-card">
            <span class="icon-big"><i class="fas fa-chart-line"></i></span>
            <h1>تسجيل الدخول</h1>
            <p class="sub-desc">أدخل كود المسوق وكلمة السر</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginCode">كود المسوق</label>
                    <input type="text" id="loginCode" placeholder="مثال: MA0001" maxlength="20" autocomplete="off" style="text-transform: uppercase;">
                </div>
                <div class="form-group">
                    <label for="loginPassword">كلمة السر</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" placeholder="أدخل كلمة السر">
                        <button type="button" id="togglePassword" class="password-toggle-btn">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
                </button>
                <div class="forgot-link">
                    <a href="/marketer-forgot-password.html">نسيت كلمة السر</a>
                </div>
                <div id="loginMessage" class="message-box"></div>
                <div class="register-link">ليس لديك حساب؟ <a href="/marketer-register.html">سجل الآن</a></div>
            </form>
        </div>
    </div>
</main>

<!-- ===== الفوتر الموحد (يتم تحميله عبر JS) ===== -->
<div id="footerPlaceholder"></div>

<!-- ===== السكربتات (الترتيب الصحيح) ===== -->
<script src="js/config.js"></script>
<script src="js/header.js"></script>
<script>
    // تحميل الهيدر من ملف خارجي
    fetch('/header.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('headerPlaceholder').innerHTML = data;
        })
        .catch(err => console.warn('⚠️ فشل تحميل الهيدر:', err));
</script>
<script src="js/utils.js"></script>
<script src="js/pages/marketer-login.js"></script>

<!-- ===== تحميل الفوتر الموحد ===== -->
<script>
    (function() {
        const footerPlaceholder = document.getElementById('footerPlaceholder');
        if (!footerPlaceholder) return;

        fetch('/footer.html')
            .then(response => {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.text();
            })
            .then(html => {
                footerPlaceholder.innerHTML = html;
            })
            .catch(err => {
                console.warn('⚠️ فشل تحميل الفوتر:', err);
                footerPlaceholder.innerHTML = `
                    <footer class="site-footer">
                        <p style="text-align:center; padding:20px; color:#94A3B8;">
                            KidCode-EG © 2026. جميع الحقوق محفوظة.
                        </p>
                    </footer>
                `;
            });
    })();
</script>

</body>
</html>
