<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=GT-TB7R77BQ"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'GT-TB7R77BQ');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>إلغاء الاشتراك - كيدكود-ايجي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/all.min.css">
    <link rel="stylesheet" href="css/base/main.css">
    <link rel="stylesheet" href="css/pages/unsubscribe.css">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/logo2.png">
    <link rel="canonical" href="https://www.kidcode-eg.com/unsubscribe" />
</head>
<body>

<!-- ===== الهيدر الموحد (يتم تضمينه عبر JS) ===== -->
<div id="headerPlaceholder"></div>

<!-- ===== المحتوى ===== -->
<main>
    <div class="unsubscribe-wrapper">
        <div class="unsubscribe-card" id="unsubscribeCard">

            <!-- أيقونة الحالة -->
            <div class="status-icon" id="statusIcon">
                <i class="fas fa-spinner fa-spin"></i>
            </div>

            <!-- العنوان -->
            <h1 id="statusTitle">جاري المعالجة</h1>

            <!-- الرسالة -->
            <p id="statusMessage">يرجى الانتظار...</p>

            <!-- زر الإجراء -->
            <div id="actionButton" class="action-button"></div>

        </div>
    </div>
</main>

<!-- ===== الفوتر الموحد (يتم تحميله عبر JS) ===== -->
<div id="footerPlaceholder"></div>

<!-- ===== السكربتات (الترتيب الصحيح) ===== -->
<script src="js/config.js"></script>
<script src="js/header.js"></script>
<script>
    // تحميل الهيدر من ملف خارجي
    fetch('/header.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('headerPlaceholder').innerHTML = data;
        })
        .catch(err => console.warn('⚠️ فشل تحميل الهيدر:', err));
</script>
<script src="js/pages/unsubscribe.js"></script>

<!-- ===== تحميل الفوتر الموحد ===== -->
<script>
    (function() {
        const footerPlaceholder = document.getElementById('footerPlaceholder');
        if (!footerPlaceholder) return;

        fetch('/footer.html')
            .then(response => {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.text();
            })
            .then(html => {
                footerPlaceholder.innerHTML = html;
            })
            .catch(err => {
                console.warn('⚠️ فشل تحميل الفوتر:', err);
                footerPlaceholder.innerHTML = `
                    <footer class="site-footer">
                        <p style="text-align:center; padding:20px; color:#94A3B8;">
                            KidCode-EG © 2026. جميع الحقوق محفوظة.
                        </p>
                    </footer>
                `;
            });
    })();
</script>

</body>
</html>
