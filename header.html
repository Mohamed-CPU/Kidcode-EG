<!-- ============================================================
     ✅ Open Graph Tags - لظهور صورة مميزة عند المشاركة
     ============================================================ -->
<script>
    (function() {
        function addOpenGraphTags() {
            if (document.querySelector('meta[property="og:title"]')) {
                return;
            }

            const pageTitle = document.title || 'KidCode-eg - أمان طفلك في صفحة واحدة';
            let pageDescription = 'نظام QR Code آمن لحماية الأطفال وإعادتهم لأسرهم بسرعة. سجل طفلك الآن واحصل على رمز QR خاص به.';
            
            const currentPath = window.location.pathname;
            if (currentPath.includes('faq')) {
                pageDescription = 'إجابات شافية على جميع أسئلتك حول نظام KidCode-eg لحماية الأطفال.';
            } else if (currentPath.includes('how-it-works')) {
                pageDescription = 'دليل شامل لمميزات خدمة KidCode-EG — التسجيل، الباقات، الإشعارات، لوحة تحكم الأسرة، والأمان.';
            } else if (currentPath.includes('reg')) {
                pageDescription = 'سجل طفلك الآن واحصل على رمز QR خاص به لحمايته في حالة فقدانه.';
            } else if (currentPath.includes('dashboard')) {
                pageDescription = 'لوحة تحكم الأسرة: إدارة بيانات طفلك، متابعة نشاط رمز QR، والإبلاغ عن الاختفاء.';
            } else if (currentPath.includes('marketer')) {
                pageDescription = 'انضم كمسوق في KidCode-eg واحصل على عمولات مقابل الترويج لخدمة حماية الأطفال.';
            } else if (currentPath.includes('about')) {
                pageDescription = 'تعرّف على KidCode-EG — منصة مصرية لحماية الأطفال باستخدام تقنية QR Code.';
            } else if (currentPath.includes('contact')) {
                pageDescription = 'تواصل مع فريق KidCode-EG — دعم فني، استفسارات، اقتراحات.';
            }

            const ogImage = 'https://www.kidcode-eg.com/assets/images/og-image.jpg';
            const ogImageSquare = 'https://www.kidcode-eg.com/assets/images/logo-square.png';

            const metaTags = [
                { property: 'og:title', content: pageTitle },
                { property: 'og:description', content: pageDescription },
                { property: 'og:image', content: ogImage },
                { property: 'og:image:width', content: '1200' },
                { property: 'og:image:height', content: '630' },
                { property: 'og:url', content: window.location.href },
                { property: 'og:type', content: 'website' },
                { property: 'og:site_name', content: 'KidCode-eg' },
                { name: 'twitter:card', content: 'summary_large_image' },
                { name: 'twitter:title', content: pageTitle },
                { name: 'twitter:description', content: pageDescription },
                { name: 'twitter:image', content: ogImage }
            ];

            const squareMeta = document.createElement('meta');
            squareMeta.setAttribute('itemprop', 'image');
            squareMeta.setAttribute('content', ogImageSquare);
            document.head.appendChild(squareMeta);

            metaTags.forEach(tag => {
                const meta = document.createElement('meta');
                if (tag.property) {
                    meta.setAttribute('property', tag.property);
                }
                if (tag.name) {
                    meta.setAttribute('name', tag.name);
                }
                meta.setAttribute('content', tag.content);
                document.head.appendChild(meta);
            });

            console.log('✅ Open Graph Tags تم إضافتها بنجاح');
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            addOpenGraphTags();
        } else {
            document.addEventListener('DOMContentLoaded', addOpenGraphTags);
        }
    })();
</script>
