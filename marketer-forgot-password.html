<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=GT-TB7R77BQ"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'GT-TB7R77BQ');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>نسيت كلمة السر - كيدكود-ايجي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/all.min.css">
    <link rel="stylesheet" href="css/base/main.css">
    <link rel="stylesheet" href="css/pages/marketer-forgot-password.css">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/logo2.png">
</head>
<body>

<!-- ===== الهيدر الموحد (يتم تضمينه عبر JS) ===== -->
<div id="headerPlaceholder"></div>

<main>
    <div class="wrapper">
        <div class="card">
            <div class="icon"><i class="fas fa-key"></i></div>
            <h1>نسيت كلمة السر</h1>
            <p>أدخل كود المسوق الخاص بك. سنرسل رابط إعادة التعيين إلى بريدك الإلكتروني.</p>
            <form id="forgotForm">
                <div class="form-group">
                    <label for="forgotCode">كود المسوق</label>
                    <input type="text" id="forgotCode" placeholder="مثال: MA0001" maxlength="20">
                </div>
                <button type="submit" class="btn" id="forgotBtn">
                    <i class="fas fa-paper-plane"></i> إرسال رابط إعادة التعيين
                </button>
                <div id="forgotMessage" class="message"></div>
                <a href="/marketer-login.html" class="back-link">العودة إلى تسجيل الدخول</a>
            </form>
        </div>
    </div>
</main>

<!-- ===== الفوتر الموحد (يتم تحميله عبر JS) ===== -->
<div id="footerPlaceholder"></div>

<!-- ===== السكربتات (الترتيب الصحيح) ===== -->
<script src="js/config.js"></script>
<script src="js/header.js"></script>
<script>
    // تحميل الهيدر من ملف خارجي
    fetch('/header.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('headerPlaceholder').innerHTML = data;
        })
        .catch(err => console.warn('⚠️ فشل تحميل الهيدر:', err));
</script>
<script src="js/pages/marketer-forgot-password.js"></script>

<!-- ===== تحميل الفوتر الموحد ===== -->
<script>
    (function() {
        const footerPlaceholder = document.getElementById('footerPlaceholder');
        if (!footerPlaceholder) return;

        fetch('/footer.html')
            .then(response => {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.text();
            })
            .then(html => {
                footerPlaceholder.innerHTML = html;
            })
            .catch(err => {
                console.warn('⚠️ فشل تحميل الفوتر:', err);
                footerPlaceholder.innerHTML = `
                    <footer class="site-footer">
                        <p style="text-align:center; padding:20px; color:#94A3B8;">
                            KidCode-EG © 2026. جميع الحقوق محفوظة.
                        </p>
                    </footer>
                `;
            });
    })();
</script>

</body>
</html>
